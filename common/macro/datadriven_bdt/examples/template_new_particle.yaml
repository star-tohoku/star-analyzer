# Starting point for a BDT of a new particle (docs/ai/candidate-bdt-guide.md, section 2: what you decide and how).
# Replace every EDIT (the toolkit refuses a recipe that still contains one); keep the rest unless a check says otherwise.
# Then: ./script/run_datadriven_bdt_chain.sh <this recipe>   (inspect, train, apply, study, report), read the report, model
name: EDIT_particle_bdt                          # readable; becomes the model and file names
particle: "EDIT: decay, reconstruction, any condition the trees cannot express"
validation: "none: not validated yet"            # set to the report path after reading the report
data:
  trees: EDIT/path/to/merged/*.tree.root         # candidate trees written by StCandidateFemtoMaker (writeCandidateTrees)
  tree: candidates_EDIT                          # candidates_<species key>
  eventSelection: "EDIT"                         # scoring domain, e.g. "cent9>=4"; candidates outside get the outside score
  preselection: "1"                              # "1" if the trees were written with the loose preselection already
  trainingSelection: ""                          # training only, e.g. "sharedTrackRemoved_<channel>==0"
  folds: runParity
  eventFraction: 1                               # lower it if inspect shows too much memory or study shows a plateau
labels:
  method: massSidebands
  mass: mass
  window: [EDIT, EDIT]                           # about +-3 sigma of the peak
  sidebands: [[EDIT, EDIT], [EDIT, EDIT]]        # outside the peak tails, close to the window
inputs:
  use: all                                       # every variable of the reconstruction part
  exclude: [massError]
  log10: []                                      # EDIT: heavy-tailed variables (decay lengths, chi2, distances)
  massCorrelationWarning: 0.1
reweight:
  variables: ["sqrt(px*px+py*py)", pz]           # side bands reweighted to the window; pT is never an input
  bins: [[30, 0, 3], [30, -3, 0.5]]
learner:
  type: xgboost
  seed: 1
  testFraction: 0.2
  parameters: {n_estimators: 600, max_depth: 3, learning_rate: 0.02, min_child_weight: 50, subsample: 0.7, colsample_bytree: 0.7,
               tree_method: hist, n_jobs: 4}
evaluation:
  massRange: [EDIT, EDIT]                        # contains window and side bands
  binWidth: EDIT
  purities: [0.75, 0.87, 0.95, 0.98]
  sculptingPurity: 0.87
  windowScan: [1.0, 0.7, 0.55, 0.4]
  checks: [sculpting, overtraining, importance, backgroundModels, trainingSize]
  trainingSize: {fractions: [0.05, 0.1, 0.25, 0.5, 1.0], purity: 0.87}
  purityBins: {}
  shapCandidates: 2000
output: EDIT/output/directory                    # outside tracked directories, e.g. a study directory under share/
