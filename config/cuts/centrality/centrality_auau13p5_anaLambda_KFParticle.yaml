# Dedicated AuAu13p5 KF copy; values unchanged from the existing AuAu13p5 Helix configuration.
# fxtmult uses the repository's Run20 13.5 GeV tables. Existing run-range extensions
# and calibration limitations remain documented in StRoot/StRefMultCorr/PROVENANCE.md.
# Bin convention: StRoot/StRefMultCorr/README.md. No centrality recalibration here.
# Centrality Cut Configuration

enabled: true
mode: fxtmult                 # refmult for collider, fxtmult for fixed-target
rejectBadRun: true
rejectPileup: true
useWeight: true
requireValidCentrality: true
verbose: false
fillCentralityQA: true
acceptedCentBins: 0,1,2,3,4,5,6,7,8  # 0-80% centrality bins
