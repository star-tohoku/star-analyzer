# producer's configuration and the downstream refuses to run on a mismatch (119 keys).
#   StFemtoMaker          ./script/singularity_run_anaFemtoPhi.sh <this> ...
#   StFemtoPhiTreeMaker   ./script/singularity_run_anaFemtoPhiTree.sh <this> ...
#   downstream            ./script/singularity_run_anaFemtoPhiTreeDownstreamV3.sh <this> ...
#
# Supersedes main_auau3p85fxt_anaFemtoPhiTree_v2.yaml as the production candidate: v2 carries no
# channels, so the channel-driven downstream produces nothing from it.
# Does not replace main_auau3p85fxt_anaFemtoPhi.yaml (the PicoDst-direct production analysis).

