# Pre-production PILOT for the reduced tree: run 22166015 only (241 PicoDst, ~0.24% of the
# dataset, 25 subjobs at nFiles 10). Its purpose is the part single-job local tests cannot reach --
# subjobId uniqueness across subjobs, hCounters summation under hadd, duplicate detection, and
# whether (subjobId, sourceFileIndex, sourceEntry) still reopens a PicoDst AFTER a merge.
# The maker config is the frozen production one, unchanged, so the tree is production-identical.
# 22166015 sits near the dense end of the ten runs measured in Step 6 (851 B/event against a
# weighted 834), so any capacity extrapolation from it is conservative.
# anaName is the key that ties config snapshot, joblist, runmeta, output and QA together,
# so the production tree gets its own rather than inheriting the pilot's _v2 name.

starTag:
  triggerSets: "production_3p85GeV_fixedTarget_2021"
  stream: "st_physics"
  collision: ""
  year: ""
  productionTag: "P24iy"
  libraryTag: "SL24y"
  filetype: "daq_reco_picoDst"
  filenameFilter: "st_physics"
  storageExclude: "HPSS"
  extraConditions: "runnumber=22166015"

dataset:
  collisionSystem: "Au+Au"
  allPicoDstList: "picoDstList/auau3p85GeVfxt.list"
  runRange:
    min: 15000000
    max: 26000000
  goodRunList: ""
  dataQuality: "production"
  dataFormat: "picoDst"

analysis:
  anaName: &anaName "auau3p85fxt_anaFemtoPhiTree_pilot"
  name: *anaName
  type: "femtoscopy-tree"
  targetParticle: "phi"
  decayChannel: "phi-{p,d,t,3He,4He} tree (schema 3), 24 channels"
  workDir: "/star/u/oura/gpfs/star-analyzer"
  logDir: "/star/u/oura/gpfs/star-analyzer/log"
  errDir: "/star/u/oura/gpfs/star-analyzer/err"
  baseRunMacro: "run_anaFemtoPhiTree"
  baseAnaMacro: "anaFemtoPhiTree"
  jobName: *anaName
  scratchSubdir: *anaName
  outputFileStem: *anaName
  nFiles: 40         # catalog ROWS, which include storage replicas: about 20 unique files,
                     # hence about 20 subjobs of one PicoDst each.
analyst:
  name: "Fumiya Oura"
  institute: "JAEA"
  email: "fumiya.oura@gmail.com"
