# Analysis info for the PRODUCTION reduced tree (Step 7). Frozen 2026-09-15.
# anaName is the key that ties config snapshot, joblist, runmeta, output and QA together,
# so the production tree gets its own rather than inheriting the pilot's _v2 name.

starTag:
  triggerSets: "production_3p85GeV_fixedTarget_2021"
  stream: "st_physics"
  collision: ""
  year: ""
  productionTag: "P24iy"
  libraryTag: "SL24y"
  filetype: "daq_reco_picoDst"
  filenameFilter: "st_physics"
  storageExclude: "HPSS"

dataset:
  collisionSystem: "Au+Au"
  allPicoDstList: "picoDstList/auau3p85GeVfxt.list"
  runRange:
    min: 15000000
    max: 26000000
  goodRunList: ""
  dataQuality: "production"
  dataFormat: "picoDst"

analysis:
  anaName: &anaName "auau3p85fxt_anaFemtoPhiTree_prod"
  name: *anaName
  type: "femtoscopy-tree"
  targetParticle: "phi"
  decayChannel: "phi-{p,d,t,3He,4He} tree (schema 3), 24 channels"
  workDir: "/star/u/oura/gpfs/star-analyzer"
  logDir: "/star/u/oura/gpfs/star-analyzer/log"
  errDir: "/star/u/oura/gpfs/star-analyzer/err"
  baseRunMacro: "run_anaFemtoPhiTree"
  baseAnaMacro: "anaFemtoPhiTree"
  jobName: *anaName
  scratchSubdir: *anaName
  outputFileStem: *anaName
  filesPerJob: 10    # PicoDst per subjob. At one per job SUMS needs 24.5 h just to write the
                     # 99,246 process file sets (measured 1.12/s on GPFS), and every job re-copies
                     # the runtime bundle. Ten gives 9,925 subjobs, about 7.7 GB of input scratch
                     # each; drop to 5 if jobs run out of scratch.
  nFiles: all        # how many catalog files to take, not files per job (maxFilesPerProcess=1).
                     # Inherited as 10 from the pilot config _v2, where it would have limited a
                     # production submission to ten files.
analyst:
  name: "Fumiya Oura"
  institute: "JAEA"
  email: "fumiya.oura@gmail.com"
