# Same production/input order as purity_upstream_20260928 (verified run 20160024).
# Energy label is beam energy in fixed-target mode, not collider sqrt(sNN).
starTag:
  triggerSets: "production_3p85GeV_fixedTarget_2019"
  stream: "st_physics"
  collision: "auau3p85"
  year: "year2019"
  productionTag: "P24iy"
  libraryTag: "SL24y"
  filetype: "daq_reco_picoDst"
  filenameFilter: "st_physics"
  filenameNotFilter: ""
  storage: "local"
dataset:
  collisionSystem: "Au+Au"
  allPicoDstList: "picoDstList/auau3p85_femtoLambda_validation_20260930.list"
  runRange:
    min: 20000000
    max: 20999999
  goodRunList: ""
  dataQuality: "production"
  dataFormat: "picoDst"
analysis:
  anaName: &anaName "auau3p85_anaFemtoLambda_t_KFParticle_highpurity"
  name: *anaName
  mode: "fxtmult"
  type: "femto"
  targetParticle: "Lambda-triton"
  decayChannel: "p+pi-"
  workDir: "/star/u/yichikawa/pwg/git_STAR_3/star-analyzer"
  baseRunMacro: "run_anaFemtoLambda_t"
  baseAnaMacro: "anaFemtoLambda_t"
  jobName: *anaName
  scratchSubdir: *anaName
  outputFileStem: *anaName
  nFiles: 20
analyst:
  name: "Yudai Ichikawa"
  institute: "Tohoku University"
  email: "yudai.ichikawa.d3@tohoku.ac.jp"
