# Step 10 T2 alpha-window scan: the nominal config with the alpha window moved to
# [1.030, 1.050]. Everything else, including the counting yield mode, is the nominal.
# If the ROT template has the right shape, alpha does not depend on where it is measured;
# a drift with window position is a template-shape error, not a statistical effect.
#
# PRODUCTION tree configuration -- the one config for Step 7. Frozen 2026-09-15 after the
# pre-production review (results/pre-production-review-20260915.md).
#
# One config drives all three legs, and that is a rule, not a convenience: the stored flags carry
# the producer's configuration, so the 119-key FemtoFlagConfig guard refuses a downstream whose
# config differs.
#   StFemtoMaker          script/singularity_run_anaFemtoPhi.sh          (reference / QA)
#   StFemtoPhiTreeMaker   script/singularity_run_anaFemtoPhiTree.sh      (production)
#   downstream            script/singularity_run_anaFemtoPhiTreeDownstreamV3.sh
#
# Decisions recorded here, all taken 2026-09-15:
#   * triton / 3He / 4He ARE stored and ARE channels. Envelope |nSigma| <= 3 costs nothing
#     (results/nuclei-cost-20260914.md: all four nuclear species at 3.0 are SMALLER than the
#     deuteron alone at 5.0), so the 18 nuclear channels come out of the same read.
#   * Nuclear femto cuts use the PRODUCTION values, TofMomentumThreshold 0.0 -- NOT the 99.0 the
#     closure configs inherited from the dE/dx-only study. Those keys are now inside the guard.
#   * h-K is OFF: enableHKaonTwoBody: false and none of the ten phikaon_* channels are declared,
#     matching production (which declares them with enabled: false). The phikaon_plus /
#     phikaon_minus SPECIES stay in speciesKeys, because phi_mix draws its mixed KK population
#     from exactly those candidate lists in the pool -- ConfigManager refuses the config without
#     them. Species present, channels absent. The downstream can still build the h-K channels
#     from this tree later if they are wanted: the kaon rows are stored.
#   * nSigmaPion is kept. Nothing reads it yet; it is deliberate insurance for a pion-contamination
#     systematic and is already counted in the 1.89 TB.
#   * kstarMassFitCf* and normQMax follow production, not the study configs.
#
# Channels: 24 = phi x {p,d,t,3He,4He} x {base, signal, leftSB, rightSB} (20) + phi_rot x {p,d}
# + phi_mix x {p,d}. Production's 34 minus the 10 h-K ones.
# Does not replace maker_auau3p85fxt_anaFemtoPhi.yaml (the PicoDst-direct production config).

# --- φ resonance builder (PhiCutConfig) ---
rapidityFrame: lab
sqrtSNNGeV: 3.85

nSigmaKaon: 3.0
maxDCAKaon: 2.0
maxDCAKK: 200
useInvMassCut: false
minOpeningAngle: 0.0
maxOpeningAngle: 3.4
minPairRapidity: -1.5
maxPairRapidity:  0.0

minPtEp: 0.15
maxPtEp: 2.0
maxEtaEp: 1.0
maxNTr: 0

# --- Femto species/channels (FemtoConfig) ---

