# kstarMassFitCF: per-k* full M_KK, S=F-αB, C = Y_SE/Y_ME. Default template ROT; MIX is cross-check.
# Yield extraction: count the bins of S = F - alpha B inside the signal window. No lineshape is
# assumed and there is no fit to fail. Decided 2026-09-17 after the gaussian's chi2/ndf was found
# to run from 1.8 to 6.5 with statistics (Step 10 T1).
kstarMassFitCfYieldMode: count
kstarMassFitCfEnabled: true
kstarMassFitCfTemplate: rot
kstarMassFitCfCrossCheck: true
kstarMassFitCfFitMassMin: 0.99
kstarMassFitCfFitMassMax: 1.06
kstarMassFitCfKstarBinWidth: 0.050
kstarMassFitCfLowKstarMergeBins: 2
kstarMassFitCfAlphaMassMin: 1.030
kstarMassFitCfAlphaMassMax: 1.050
kstarMassFitCfWriteSidecar: true
purityDirectFitModel: gaus_pol2

