# DATA-006 downstream-only pair and delivery configuration.
#
# Selection flags still come from, and are checked against, the frozen producer mainconf
# main_auau3p85fxt_anaFemtoPhiTree_prod.yaml.  This file changes no producer-side event, track,
# PID, or centrality decision.  It defines only track-track pairing, histogram axes, normalization,
# and the requested native/merged output classes.

# Native 5 MeV/c bins.  The ROOT working histograms retain 0--3 GeV/c so the 0.5--1.0 GeV/c
# normalization region is explicit; the delivered fitter table stops at 0.5 GeV/c.
kstarBins: 600
kstarMin: 0.0
kstarMax: 3.0
deliveryKstarMax: 0.5

# mT means mT_pair/2 = 0.5*sqrt((E1+E2)^2-(pz1+pz2)^2).
pairMtBins: 150
pairMtMin: 0.8
pairMtMax: 3.8
pairRapidityBins: 160
pairRapidityMin: -1.5
pairRapidityMax: 0.5

# Baseline is deliberately OFF because the current phi production has closePairEnabled=false.
# The Δη--Δφ* QA is still filled for SE and ME.  Enabling this switch applies the per-channel
# windows below identically to SE and ME and therefore constitutes an explicit cut variation.
closePairEnabled: false
closePairShape: box
closePairRadiusMin: 0.6
closePairRadiusMax: 2.0
closePairRadiusStep: 0.05

nChannels: 3
channel_0_channelName: proton_proton
channel_0_partA: proton
channel_0_partB: proton
channel_0_enabled: true
channel_0_doMixing: true
channel_0_normQMin: 0.5
channel_0_normQMax: 1.0
channel_0_closePairDEta: 0.015
channel_0_closePairDPhiStar: 0.015

channel_1_channelName: proton_deuteron
channel_1_partA: proton
channel_1_partB: deuteron
channel_1_enabled: true
channel_1_doMixing: true
channel_1_normQMin: 0.5
channel_1_normQMax: 1.0
channel_1_closePairDEta: 0.040
channel_1_closePairDPhiStar: 0.040

channel_2_channelName: deuteron_deuteron
channel_2_partA: deuteron
channel_2_partB: deuteron
channel_2_enabled: true
channel_2_doMixing: true
channel_2_normQMin: 0.5
channel_2_normQMax: 1.0
channel_2_closePairDEta: 0.040
channel_2_closePairDPhiStar: 0.040

# cent9 grows toward central events.  Native and paper-comparison classes are both explicit.
# 10--20% appears once because it is simultaneously native and a paper-comparison class.
nCentralityClasses: 10
centrality_0_id: pct_0_5
centrality_0_lowPercent: 0
centrality_0_highPercent: 5
centrality_0_cent9Min: 8
centrality_0_cent9Max: 8
centrality_0_refmultLow: 142
centrality_0_refmultHigh: 220
centrality_0_nativeClass: true

