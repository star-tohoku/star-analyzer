# TREE-STUDY ONLY. The species-isolation control for maker_..._g5refn.yaml: identical in every
# cut value, with only the deuteron bachelor enabled. StFemtoMaker's yield for a species must not
# depend on which other species are enabled; comparing a g5refn run against a g5refd run measures
# exactly that, and is the check on the `continue` fix of 2026-09-14
# (results/closure-proton-20260914.md).
# Identical to maker_..._g5refn.yaml apart from speciesKeys and the channel list.
# Does not replace maker_auau3p85fxt_anaFemtoPhi_dedxOnly.yaml.
# Selection, as inherited from g5refp and corrected to production values in 227c5d9:
#   proton, deuteron  TofMomentumThreshold 0.0 -- TOF match and the m2 window are required
#   triton, 3He, 4He  TofMomentumThreshold 99.0 -- dE/dx only, TOF not required
# NuclearId m2_selection false.

# --- φ resonance builder (PhiCutConfig) ---
rapidityFrame: lab
sqrtSNNGeV: 3.85

nSigmaKaon: 3.0
maxDCAKaon: 2.0
maxDCAKK: 200
useInvMassCut: false
minOpeningAngle: 0.0
maxOpeningAngle: 3.4
minPairRapidity: -1.5
maxPairRapidity:  0.0

minPtEp: 0.15
maxPtEp: 2.0
maxEtaEp: 1.0
maxNTr: 0

# --- Femto species/channels (FemtoConfig) ---

speciesKeys: deuteron,phi

species_proton_builderType: track
species_proton_particleKey: proton

species_deuteron_builderType: track
species_deuteron_particleKey: deuteron

species_triton_builderType: track
species_triton_particleKey: triton

species_he3_builderType: track
species_he3_particleKey: he3

species_he4_builderType: track
species_he4_particleKey: he4

species_phi_builderType: resonance
species_phi_particleKey: phi

species_phi_rot_builderType: resonance
species_phi_rot_particleKey: phi_rotation

species_phi_mix_builderType: resonance
species_phi_mix_particleKey: phi_fully_mixed

# phi-daughter kaon track species (h-K correlations extension): identical selection to phi daughters.
species_phikaon_plus_builderType: track
species_phikaon_plus_particleKey: phi_kaon_plus

species_phikaon_minus_builderType: track
species_phikaon_minus_particleKey: phi_kaon_minus

# h-K correlations extension flags (additive; existing paths unchanged).
# OFF for CF production (Kubo/h-K are heavy; re-enable in a dedicated mainconf if needed).
enableHKaonTwoBody: false
enableKuboTriplet: false
enableKuboGenuine: false
kuboStoreFullMass: false

cfRebinFactor: 5
cfCent9Min: 2
cfCent9Max: 8
cfCentSlicesQaPdfInclude: pct_0_10,pct_0_20,pct_0_30
cfPdfExcludeQaSlices: true

sidebandSubtractAlpha: 1.0
sidebandAlphaMode: fixed
negativeBinPolicy: zero

# Deprecated Topic 3 / Method 5 (off unless legacyCfPagesEnabled).
purityFitUseConstantBkg: true
purityFitGaussSigmaMin: 0.002
purityFitGaussSigmaMax: 0.020
purityMinKstar: 0.0
purityMaxKstar: 0.65
purityMinEntriesPerBin: 20
purityClampMin: 0.05
purityClampMax: 1.0
cfBkgMode: me_mass

legacyCfPagesEnabled: false
cfSubtractionMode: none
cfSubPurityMode: fit_slice
cfSubPurityFixed: 0.7
cfSubSidebandCombine: sumLR
cfSubWriteSidecarRoot: false
cfSubLowStatsRebinExtra: 2

# kstarMassFitCF: per-k* full M_KK, S=F-αB, C = Y_SE/Y_ME. Default template ROT; MIX is cross-check.
kstarMassFitCfEnabled: true
kstarMassFitCfTemplate: rot
kstarMassFitCfCrossCheck: true
kstarMassFitCfFitMassMin: 0.99
kstarMassFitCfFitMassMax: 1.06
kstarMassFitCfKstarBinWidth: 0.040
kstarMassFitCfLowKstarMergeBins: 1  # 1 = no low-k* merge (each rebinned bin kept)
kstarMassFitCfAlphaMassMin: 1.05
kstarMassFitCfAlphaMassMax: 1.105
kstarMassFitCfWriteSidecar: true
purityDirectFitModel: gaus_pol2

# PID QA: quality tracks near signal-window phi (PRF k*). Not used in CF.
phiNearTrackQaEnabled: false
phiNearTrackSignalChannel: phi_deuteron_signal
phiNearTrackMaxKstarLoose: 1.0
phiNearTrackMaxKstarTight: 0.3
phiNearTrackMassHyp: pion

# Proton bachelor cuts
protonChargeMode: positive
protonMaxDca: 1.0
protonMinPtPre: 0.2
protonMinPtPair: 0.4
protonMaxPtPair: 2.0
protonMaxAbsEta: 2.0
protonMaxAbsNSigma: 2.0
protonMinNHitsFit: 15
protonMinNHitsRatio: 0.52
# |p| < threshold: TPC nσ only (no TOF match, no m2 veto). |p| >= threshold: TOF + m2 in [protonMinMass2,protonMaxMass2].
protonTofMomentumThreshold: 0.0
protonMinMass2: 0.6
protonMaxMass2: 1.2
protonMinRapidityCm: -1.0
protonMaxRapidityCm: 0.0

# Deuteron bachelor cuts
deuteronMaxDca: 1.0
deuteronMinPMom: 0.2
deuteronMaxPMom: 3.0
deuteronMinPtPre: 0.2
deuteronMaxPtPre: 3.0
deuteronMinPtPair: 0.4
deuteronMaxPtPair: 3.0
deuteronMaxAbsEta: 2.0
deuteronMaxAbsNSigma: 2.0
deuteronMinNHitsFit: 15
deuteronMinNHitsRatio: 0.52
deuteronTofMomentumThreshold: 0.0
deuteronMinMass2: 2.5
deuteronMaxMass2: 4.5
deuteronMinRapidityCm: -1.0
deuteronMaxRapidityCm: 0.0

# Triton bachelor cuts
tritonMaxDca: 1.0
tritonMinPMom: 0.2
tritonMaxPMom: 3.0
tritonMinPtPre: 0.2
tritonMaxPtPre: 3.0
tritonMinPtPair: 0.4
tritonMaxPtPair: 3.0
tritonMaxAbsEta: 2.0
tritonMaxAbsNSigma: 2.0
tritonMinNHitsFit: 15
tritonMinNHitsRatio: 0.52
tritonTofMomentumThreshold: 99.0
tritonMinMass2: 5.8
tritonMaxMass2: 9.8
tritonMinRapidityCm: -1.0
tritonMaxRapidityCm: 0.0

# ³He bachelor cuts
he3MaxDca: 1.0
he3MinPMom: 0.2
he3MaxPMom: 3.0
he3MinPtPre: 0.2
he3MaxPtPre: 3.0
he3MinPtPair: 0.4
he3MaxPtPair: 3.0
he3MaxAbsEta: 2.0
he3MaxAbsNSigma: 2.0
he3MinNHitsFit: 15
he3MinNHitsRatio: 0.52
he3TofMomentumThreshold: 99.0
he3MinMass2: 0.8
he3MaxMass2: 2.8
he3MinRapidityCm: -1.0
he3MaxRapidityCm: 0.0

# ⁴He bachelor cuts
he4MaxDca: 1.0
he4MinPMom: 0.2
he4MaxPMom: 3.0
he4MinPtPre: 0.2
he4MaxPtPre: 3.0
he4MinPtPair: 0.4
he4MaxPtPair: 3.0
he4MaxAbsEta: 2.0
he4MaxAbsNSigma: 2.0
he4MinNHitsFit: 15
he4MinNHitsRatio: 0.52
he4TofMomentumThreshold: 99.0
he4MinMass2: 2.5
he4MaxMass2: 4.5
he4MinRapidityCm: -1.0
he4MaxRapidityCm: 0.0

# Rotation / MIX KK off: pool must contain only phi+d to match tree downstream.
rotationEnabled: false
rotationSpeciesKey: phi_rot
rotationParticleKey: phi_rotation
rotationN: 10
rotationMinAngle: 0.0
rotationMaxAngle: 6.283185307179586

fullyMixedEnabled: false
fullyMixedSpeciesKey: phi_mix
fullyMixedParticleKey: phi_fully_mixed
fullyMixedMaxCandidates: 2000
fullyMixedSamplingSeed: 314159

nChannels: 4

channel_0_channelName: phi_deuteron
channel_0_partA: phi
channel_0_partB: deuteron
channel_0_enabled: true
channel_0_doMixing: true
channel_0_signalMin: 1.01
channel_0_signalMax: 1.03
channel_0_normQMin: 0.5
channel_0_normQMax: 0.6

channel_1_channelName: phi_deuteron_signal
channel_1_partA: phi
channel_1_partB: deuteron
channel_1_enabled: true
channel_1_doMixing: true
channel_1_signalMin: 1.012
channel_1_signalMax: 1.026
channel_1_normQMin: 0.5
channel_1_normQMax: 0.6

channel_2_channelName: phi_deuteron_leftSB
channel_2_partA: phi
channel_2_partB: deuteron
channel_2_enabled: true
channel_2_doMixing: true
channel_2_signalMin: 0.990
channel_2_signalMax: 1.005
channel_2_normQMin: 0.5
channel_2_normQMax: 0.6

channel_3_channelName: phi_deuteron_rightSB
channel_3_partA: phi
channel_3_partB: deuteron
channel_3_enabled: true
channel_3_doMixing: true
channel_3_signalMin: 1.035
channel_3_signalMax: 1.060
channel_3_normQMin: 0.5
channel_3_normQMax: 0.6






# ---- tree I/O ----
treeSchemaVersion: 3        # packed event row as well
treeWriteEvent: true
treeWriteTrack: true
treeWritePhiPair: false        # schema 2 does not support it; pairs are rebuilt downstream
treeStoreKaons: true
treeStoreDeuterons: true
treeStoreProtons: true         # plan sec 3.3: unconditional, no K- gate
treeCompressionLevel: 1        # T6: LZMA costs 3.4-4x read time for 13% size
treeAutoFlush: 10000
# Companion tree with the phi-daughter kaon helix origin, so the maxDCAKK systematic stays
# available. Measured cost +0.211% of the tree (1.8984 -> 1.9021 TB): the KK DCA is a phi-daughter
# quantity, and kaons are 0.66% of stored rows once the daughter-PID reach gate is applied. On
# every row the same three components would cost +32%. Decision log, 2026-09-14.
treeWriteKaonOrigin: true
# Light nuclei beyond the deuteron. OFF pending the capacity decision: they serve 18 of the
# analysis's 34 channels but the headroom against 2.0 TB is thin. Measured cost in
# results/nuclei-cost-20260914.md.
treeStoreTriton: true
treeStoreHe3: true
treeStoreHe4: true
envMaxAbsNSigmaTriton: 3.0
envMaxAbsNSigmaHe3: 3.0
envMaxAbsNSigmaHe4: 3.0

# ---- provenance ----
# Recorded per event; no selection is applied on them here, so a trigger variation
# stays possible downstream. Run21 3.85 GeV FXT bbce_tofmult triggers.
triggerIds: [820010, 820020, 820030]
# No dE/dx nSigma recalibration is applied anywhere in this chain yet. If one is added,
# change this string so that trees produced before and after are distinguishable.
pidCorrectionState: "none"

# ---- loose storage envelope ----
# Values are the loosest of every planned variation (T3). Tightening any of these
# forecloses the corresponding systematic and requires a full re-production.
envMinNHitsFit: 15             # variations: 15 / 17 / 20
envMinNHitsRatio: 0.50
envMinNHitsDedx: 10
envMaxDca: 3.0                 # variations: 1.0 / 2.0 / 3.0
envMinPt: 0.15                 # variations: 0.15 / 0.2
envMaxPt: 10.0
envMinEta: -2.0
envMaxEta: 0.2                 # inert in this frame: FXT primaries all have eta < 0
envMaxChi2: 5.0                # variations: 3.0 / 5.0
envMaxAbsNSigmaKaon: 5.0       # variations: 3.0 (nominal) / 5.0
# Restrict the kaon store to what the production daughter PID can use. Measured to be
# lossless: signal phi, ROT, MIX and the K-p kaon species all apply PassPhiDaughterTofPid,
# and tofFallbackMode only gates the loose collection, which reaches QA histograms alone.
envKaonRequireTofOrLowP: true
envKaonLowPMax: 0.5            # must equal pid.pMomKaonPID
# Narrow the kaon store to rows PassPhiDaughterTofPid could ever accept. Step 5 measurement on
# the 5-file pilot: this drops the kaon store from 602,074 rows to 24,201 and pays for raising
# envMaxAbsNSigmaKaon from 3.0 to 5.0 several times over -- 833.88 -> 767.59 B/event,
# 1.899 -> 1.748 TB, while recovering the |nSigmaK| <= 5 systematic (+13.5% phi daughters) that
# the 3.0 envelope had foreclosed. The TPC-only branch keeps both charges so that the
# K- TPC-only variation stays reproducible.
envKaonRequireDaughterPidReach: true
# Storage envelope, NOT the PID cut. Must stay wider than any planned m2 systematic; the widest
# planned one is 0.10-0.40, so this leaves real headroom. Costs 0.003 TB over a 0.10-0.40 gate.
envKaonMass2Lo: 0.05
envKaonMass2Hi: 0.50
envMaxAbsNSigmaDeuteron: 3.0   # variations: 2.0 / 3.0 / 5.0
envMaxAbsNSigmaProton: 3.0     # loosest planned variation
envMaxDcaKaon: 3.0
envDeuteronMaxDca: 2.0         # variations: 1.0 / 2.0
envDeuteronMinPMom: 0.15
envDeuteronMaxPMom: 4.0
envProtonMaxDca: 1.5           # loosest planned variation
envProtonMinPt: 0.15
envMinNHitsDedxNuclear: 10

# --- TPC two-track (close-pair) cut, Step 4b ---
# Applied between each phi daughter and the bachelor, in same-event and mixed-event alike.
# Windows measured on this dataset (results/closepair-step4b-20260914.md); they differ per
# bachelor species, so phi-d's value is NOT reused for phi-p. Both are indicative at five files
# and must be re-measured at production statistics before they are quoted as final.
closePairEnabled: false          # off until the windows are re-measured at full statistics
closePairShape: box              # box | ellipse
closePairRadiusMin: 0.6          # m, TPC inner field cage
closePairRadiusMax: 2.0          # m, TPC outer radius
closePairRadiusStep: 0.05        # m
closePairDEtaDeuteron: 0.040
closePairDPhiStarDeuteron: 0.040
closePairDEtaProton: 0.015
closePairDPhiStarProton: 0.015
# One physical track can satisfy two species storage rules: 4.10% of selected phi-daughter kaons
# are also selected as bachelor protons. Without this veto such a pair is a track paired with
# itself, and it lands at exactly zero separation.
closePairVetoSameTrack: true
